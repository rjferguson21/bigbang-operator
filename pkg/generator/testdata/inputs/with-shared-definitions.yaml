apiVersion: bigbang.dev/v1alpha1
kind: Package
metadata:
  name: example-app
  namespace: example-app
  uid: 11111111-1111-1111-1111-111111111111
spec:
  networkPolicies:
    enabled: true
    egress:
      defaults:
        enabled: false
      definitions:
        # Collides with the shared definition: package-local must win.
        object-storage:
          ports:
            - port: 9000
              protocol: TCP
          to:
            - ipBlock: { cidr: 10.43.0.0/16 }
      from:
        example-app:
          to:
            definition:
              elasticsearch: true   # from the shared pool
              object-storage: true  # local override of a shared name
              kubeAPI: true         # built-in, unaffected by shared pool
    ingress:
      defaults:
        enabled: false
      to:
        example-app:8080:
          from:
            definition:
              argocd: true          # from the shared ingress pool
              gateway: true         # built-in ingress definition
