apiVersion: bigbang.dev/v1alpha1
kind: Package
metadata:
  name: example-app
  namespace: example-app
  uid: 11111111-1111-1111-1111-111111111111
spec:
  istio:
    enabled: true
  routes:
    inbound:
      example-app:
        enabled: true
        gateways:
          - istio-gateway/public-ingressgateway
        hosts:
          - "*.bigbang.mil"
        service: example-app
        port: 8080
