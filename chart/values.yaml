image:
  # Default to the GHCR-published image. For Iron Bank-hardened deploys,
  # override repository to registry1.dso.mil/ironbank/big-bang/bigbang-operator.
  repository: ghcr.io/rjferguson21/bigbang-operator
  tag: 0.2.1
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 1

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Shared operator configuration. The operator reads egress/ingress
# definitions from this ConfigMap (in the release namespace) and makes them
# resolvable from any Package's networkPolicies.*.definition.<name>.
# Precedence on name collision: built-in < shared < package-local.
globalConfig:
  name: bigbang-operator-global
  # Render the ConfigMap from this chart. Leave false to manage it
  # out-of-band (e.g. from a GitOps repo).
  create: false
  # Maps of definition name -> same schema as
  # networkPolicies.{egress,ingress}.definitions.<name>.
  egressDefinitions: {}
  ingressDefinitions: {}

# Manager command-line flags.
leaderElection:
  enabled: true
metrics:
  bindAddress: ":8443"
  secure: true
healthProbe:
  bindAddress: ":8081"

# Pod security context.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
