apiVersion: v1
kind: Namespace
metadata:
  name: hook-dependencies
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hook-dependencies
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backend}
    spec:
      containers:
        - name: backend
          image: ghcr.io/stefanprodan/podinfo:6.10.1
          ports: [{containerPort: 9898}]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hook-dependencies
spec:
  selector: {app.kubernetes.io/name: backend}
  ports: [{port: 8080, targetPort: 9898}]
