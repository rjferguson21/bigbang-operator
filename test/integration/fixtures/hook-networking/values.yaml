failHook: false
operatorHooks:
  timeoutSeconds: 180
networkPolicies:
  enabled: true
  defaultsAsHooks:
    enabled: true
    hooks: [pre-install, pre-upgrade, pre-rollback, pre-delete, post-delete]
  ingress:
    defaults:
      allowInNamespace:
        enabled: false
  egress:
    defaults:
      allowInNamespace:
        enabled: false
    from:
      admission-hooks:
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: '{{ .Release.Name }}'
            app.kubernetes.io/component: prometheus-operator-webhook
        metadata:
          annotations:
            helm.sh/hook: pre-install,pre-upgrade,post-install,post-upgrade,pre-rollback,post-rollback,pre-delete,post-delete
            helm.sh/hook-weight: '-10'
        to:
          definition:
            kubeAPI: true
          k8s:
            hook-dependencies/backend:9898: true
