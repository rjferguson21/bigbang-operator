{{- $phases := "pre-install,pre-upgrade,post-install,post-upgrade,pre-rollback,post-rollback" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-admission
  annotations:
    helm.sh/hook: {{ $phases }}
    helm.sh/hook-weight: '-20'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-admission
  annotations:
    helm.sh/hook: {{ $phases }}
    helm.sh/hook-weight: '-20'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-admission
  annotations:
    helm.sh/hook: {{ $phases }}
    helm.sh/hook-weight: '-20'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-admission
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-admission
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-admission
  annotations:
    helm.sh/hook: {{ $phases }}
    helm.sh/hook-weight: '-20'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingwebhookconfigurations]
    resourceNames: [{{ printf "%s-%s-admission" .Release.Namespace .Release.Name | quote }}]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-admission
  annotations:
    helm.sh/hook: {{ $phases }}
    helm.sh/hook-weight: '-20'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-admission
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-admission
    namespace: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-admission
webhooks:
  - name: admission.test.bigbang.dev
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Ignore
    clientConfig:
      service:
        name: admission
        namespace: {{ .Release.Namespace }}
        path: /validate
    rules: []
{{- range $action := list "create" "patch" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-admission-{{ $action }}
  annotations:
    helm.sh/hook: {{ if eq $action "create" }}pre-install,pre-upgrade,pre-rollback{{ else }}post-install,post-upgrade,post-rollback{{ end }}
    helm.sh/hook-weight: '0'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: prometheus-operator-webhook
    spec:
      serviceAccountName: {{ $.Release.Name }}-admission
      restartPolicy: Never
      initContainers:
        - name: dependency
          image: curlimages/curl:8.12.1
          command: [sh, -ec]
          args:
            - >-
              {{ if $.Values.failHook }}exit 1;{{ end }}
              curl --fail --retry 20 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 3 http://backend.hook-dependencies.svc.cluster.local:8080;
              sleep 2
      containers:
        - name: {{ $action }}
          image: ghcr.io/jkroepke/kube-webhook-certgen:1.8.8
          args:
            - {{ $action }}
            - --namespace={{ $.Release.Namespace }}
            - --secret-name={{ $.Release.Name }}-admission
            {{- if eq $action "create" }}
            - --host=admission,admission.{{ $.Release.Namespace }}.svc
            {{- else }}
            - --webhook-name={{ $.Release.Namespace }}-{{ $.Release.Name }}-admission
            - --patch-mutating=false
            - --patch-validating=true
            - --patch-failure-policy=Ignore
            {{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-delete-dependency
  annotations:
    helm.sh/hook: pre-delete,post-delete
    helm.sh/hook-weight: '0'
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 60
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: prometheus-operator-webhook
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: dependency
          image: curlimages/curl:8.12.1
          command: [sh, -ec]
          args:
            - >-
              curl --fail --retry 10 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 3 http://backend.hook-dependencies.svc.cluster.local:8080;
              sleep 2
